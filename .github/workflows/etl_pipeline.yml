name: Market-Data Ops & Portfolio Analytics Cron ETL

on:
  schedule:
    # 2:30 PM UTC = 8:00 PM IST (Monday through Friday, post market close)
    - cron: '30 14 * * 1-5'
  workflow_dispatch:
    inputs:
      trade_date:
        description: 'Trade date to ingest (YYYY-MM-DD)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  market_data_etl:
    name: Run Scheduled Ingestion & Reconciliation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Market-Data Ingestion & Quality Reconciliation
        run: |
          python main.py --task etl

      - name: Execute Portfolio Analytics & Backtest Verification
        run: |
          python main.py --task analytics

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Commit & Push Reconciled Data Lake Partitions & Governance Note
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lake/ docs/data_governance_note.md
          if git diff --staged --quiet; then
            echo "No data lake partition changes to commit."
          else
            git commit -m "chore(etl): automated cron market-data ingestion and quality reconciliation [skip ci]"
            git push
          fi
